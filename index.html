<title>Habla con Luti</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
img{max-width:100%}
/* Layout: hoja de cuaderno (renglones azules + margen rojo) como el manual; columna central de 720px; en la misión, chat arriba y micrófono abajo. */
:root{
  --paper:#f6f8fd; --rule:#e2e8f4; --margin:#f0b3b5;
  --card:#ffffff; --card-2:#f1f4fb; --line:#d8e0ee;
  --ink:#15213f; --ink-2:#47547a; --ink-3:#77829f;
  --navy:#203e8c; --navy-deep:#172f6d; --on-navy:#ffffff; --navy-soft:#e8eefb;
  --red:#a2262d; --red-soft:#fbe8e9; --on-red:#ffffff;
  --green:#22784f; --green-soft:#e3f4ea;
  --c-subj:#2563c9; --c-verb:#1e8a4c; --c-neg:#cf2e2e; --c-key:#203e8c;
  --ok:#1e8a4c; --ok-soft:#e3f4ea; --warn:#9a5c00; --warn-soft:#fff2d9; --bad:#c22f36; --bad-soft:#fde7e8;
  --shadow:0 1px 2px rgba(21,33,63,.06),0 8px 22px rgba(21,33,63,.07);
  --f-ui:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Kalam","Comic Sans MS","Segoe Print",cursive;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0c1430; --rule:#16214a; --margin:#4f2230;
  --card:#131d40; --card-2:#19254f; --line:#26346a;
  --ink:#e8edfb; --ink-2:#b3bedc; --ink-3:#8692b8;
  --navy:#3a60c6; --navy-deep:#2b4ea6; --on-navy:#ffffff; --navy-soft:#1c2a5a;
  --red:#ff7f86; --red-soft:#3a1b27; --on-red:#1a0a10;
  --green:#5dd394; --green-soft:#15362a;
  --c-subj:#86b4ff; --c-verb:#5dd394; --c-neg:#ff7f86; --c-key:#b3c6ff;
  --ok:#5dd394; --ok-soft:#14352a; --warn:#ffc46b; --warn-soft:#3a2c12; --bad:#ff7f86; --bad-soft:#3a1b27;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0c1430; --rule:#16214a; --margin:#4f2230;
  --card:#131d40; --card-2:#19254f; --line:#26346a;
  --ink:#e8edfb; --ink-2:#b3bedc; --ink-3:#8692b8;
  --navy:#3a60c6; --navy-deep:#2b4ea6; --on-navy:#ffffff; --navy-soft:#1c2a5a;
  --red:#ff7f86; --red-soft:#3a1b27; --on-red:#1a0a10;
  --green:#5dd394; --green-soft:#15362a;
  --c-subj:#86b4ff; --c-verb:#5dd394; --c-neg:#ff7f86; --c-key:#b3c6ff;
  --ok:#5dd394; --ok-soft:#14352a; --warn:#ffc46b; --warn-soft:#3a2c12; --bad:#ff7f86; --bad-soft:#3a1b27;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;bottom:0;left:10px;width:2px;background:var(--margin);opacity:.7;pointer-events:none;z-index:0}
@media (min-width:760px){body::before{left:34px}}
#app{position:relative;z-index:1;min-height:100%}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 40px;box-sizing:border-box}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c-subj);outline-offset:2px;border-radius:8px}
a{color:var(--navy)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img{width:38px;height:38px;flex:none}
.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--navy)}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.iconbtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;flex:none}
.iconbtn svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip svg{width:16px;height:16px}

/* ---------- inicio ---------- */
.hero{position:relative;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--navy);color:var(--on-navy);border-radius:22px;padding:18px;box-shadow:var(--shadow);overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,rgba(255,255,255,.06) 27px,rgba(255,255,255,.06) 28px);pointer-events:none}
.hero .ava-xl{width:92px;height:92px;border-radius:50%;border:3px solid rgba(255,255,255,.85);object-fit:cover;background:var(--navy-deep)}
.hero .note{position:relative;z-index:1;background:#fffdf3;color:#15213f;border-radius:6px 16px 16px 16px;padding:10px 12px;transform:rotate(-.6deg);box-shadow:0 6px 14px rgba(0,0,0,.18)}
.hero .note .hand{font-family:var(--f-hand);font-weight:700;font-size:21px;line-height:1.15;color:#203e8c}
.hero .note p{margin:4px 0 0;font-size:13.5px;color:#47547a}
.hero .cta{grid-column:1/-1;position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:0;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--red);color:var(--on-red)}
:root:not([data-theme="dark"]) .btn.primary{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:var(--on-red)}}
.btn.light{background:#fff;color:#203e8c}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.navy{background:var(--navy);color:var(--on-navy)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hero .cta .next{font-size:13px;opacity:.9;min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.banner{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:14px}
.banner svg{width:22px;height:22px;flex:none;color:var(--warn)}
.banner b{display:block}
.banner.good{background:var(--ok-soft);border-color:transparent;text-align:left}
.banner.good svg{color:var(--ok)}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.units{display:grid;gap:12px}
.ucard{display:grid;grid-template-columns:76px 1fr;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;text-align:left;padding:0;width:100%}
.ucard.locked{opacity:.62}
.ucard .num{background:var(--navy);color:var(--on-navy);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px}
.ucard .num small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.ucard .num b{font-size:34px;line-height:1;font-weight:800}
.ucard.final .num{background:var(--red)}
.ucard .body{padding:12px 14px;min-width:0}
.ucard h3{font-size:17px;font-weight:700}
.ucard p{margin:2px 0 8px;font-size:13px;color:var(--ink-2)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.done{background:var(--green-soft);color:var(--green);border-color:transparent}
.pill.open{background:var(--navy-soft);color:var(--navy);border-color:transparent}
.pill svg{width:13px;height:13px}
.stars{display:inline-flex;gap:1px}
.stars svg{width:13px;height:13px}
.star-on{color:#e8a100}.star-off{color:var(--line)}
.foot{margin-top:28px;font-size:12px;color:var(--ink-3);text-align:center}

/* ---------- unidad ---------- */
.uhead{display:grid;grid-template-columns:auto 1fr;gap:14px;background:var(--navy);color:var(--on-navy);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.uhead.final{background:var(--red)}
.uhead .big{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px}
.uhead .big small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.uhead .big b{font-size:46px;line-height:1;font-weight:800}
.uhead h1{font-size:20px;font-weight:700}
.uhead p{margin:6px 0 0;font-size:14px;opacity:.92}
.levels{display:grid;gap:12px;margin-top:16px}
.lvl{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;box-shadow:var(--shadow)}
.lvl .badge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--navy-soft);color:var(--navy);text-align:center;line-height:1.1}

.lvl.passed .badge{background:var(--green-soft);color:var(--green)}
.lvl h3{font-size:16px}
.lvl .meta{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.lvl .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--red);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:var(--on-red)}}
:root[data-theme="dark"] .tag{color:var(--on-red)}
@media (max-width:460px){.lvl{grid-template-columns:auto 1fr}.lvl .go{grid-column:1/-1}.lvl .go .btn{width:100%}}
.topics{display:grid;gap:8px}
.topic{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.topic .tn{flex:none;font-weight:800;font-size:12px;background:var(--red);color:#fff;border-radius:6px;padding:2px 7px;margin-top:2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .topic .tn{color:var(--on-red)}}
:root[data-theme="dark"] .topic .tn{color:var(--on-red)}
.topic .tt{min-width:0;flex:1}
.topic .tt b{display:block;font-size:14px}
.topic .tt i{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;box-shadow:var(--shadow);width:100%}
.tool .ti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--navy-soft);color:var(--navy);flex:none}

.legend>span{white-space:nowrap}

/* ---------- código de colores ---------- */
.w-s{color:var(--c-subj);font-weight:700}.w-v{color:var(--c-verb);font-weight:700}.w-n{color:var(--c-neg);font-weight:700}.w-k{color:var(--c-key);font-weight:700}

/* ---------- glosario ---------- */
.search{width:100%;box-sizing:border-box;min-height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit}
.key{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0;font-size:12.5px}
.key b{color:var(--red);font-size:15px;margin-right:4px}
.glist{display:grid;gap:6px}
.gitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.gitem .gt{min-width:0}
.gitem .ge{font-weight:700}
.gitem .gp{color:var(--red);font-weight:600;margin:0 4px}
.gitem .gs{color:var(--ink-2)}
.gitem .gb{display:flex;gap:6px}
.gitem .res{grid-column:1/-1;font-size:13px}
.gitem .res:empty{display:none}
.gsub{margin:18px 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.mini{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card-2);cursor:pointer}
.mini svg{width:19px;height:19px}
.mini.rec{background:var(--bad);color:#fff;border-color:transparent}

/* ---------- misión (chat) ---------- */
.lesson{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
.lbar{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);position:relative;z-index:2}
.lbar .prog{flex:1;height:10px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);overflow:hidden}
.lbar .prog i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .4s}
.lbar .lt{font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.chat{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg .ava{width:38px;height:38px;border-radius:50%;flex:none;object-fit:cover;background:var(--navy)}
.msg .ini{display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 13px;box-shadow:var(--shadow);min-width:0;max-width:min(100%,560px)}
.bubble .who{font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:2px}
.msg.char .bubble{background:var(--navy-soft);border-color:transparent}
.msg.me{justify-content:flex-end}
.msg.me .bubble{background:var(--navy);color:var(--on-navy);border-color:transparent;border-radius:18px 18px 6px 18px}
.msg.me .bubble .w-ok{color:#bff3d4;font-weight:700}.msg.me .bubble .w-miss{color:#ffd0d2;text-decoration:underline wavy;text-underline-offset:3px}
.msg.me .bubble small{display:block;opacity:.8;font-size:11.5px}
.phrase{margin-top:6px;padding:10px 12px;border-radius:14px;background:var(--card-2);border:1px dashed var(--line)}
.msg.char .phrase{background:var(--card)}
.phrase .en{font-size:20px;font-weight:600;line-height:1.3}
.phrase .en.hidden{filter:blur(7px);user-select:none}
.phrase .ph{color:var(--red);font-weight:600;font-size:14px;margin-top:2px}
.phrase .es{color:var(--ink-2);font-size:14px;margin-top:2px}
.phrase .tip{margin-top:6px;font-size:13px;color:var(--ink-2)}
.arow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.abtn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:600}
.abtn svg{width:17px;height:17px}
.sitcard{margin-top:6px;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--card-2);border:1px solid var(--line)}
.sitcard svg{width:26px;height:26px;flex:none;color:var(--red)}
.sitcard div{font-size:15px;font-weight:500}
.quote{margin-top:6px;background:var(--red);color:#fff;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .quote{color:var(--on-red)}}
:root[data-theme="dark"] .quote{color:var(--on-red)}
.quote b{font-weight:800}
.care{margin-top:6px;border:2px solid var(--bad);border-radius:14px;padding:9px 12px;background:var(--bad-soft);font-size:14px}
.care b{color:var(--bad)}
.truco{margin-top:6px;border:2px solid var(--navy);border-radius:14px;padding:9px 12px;background:var(--navy-soft);font-size:14px}
.fb{align-self:stretch;border-radius:14px;padding:10px 12px;font-size:14px;border:1px solid transparent;margin-left:46px}
.fb.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.fb.near{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.fb.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.fb .h{font-weight:800;display:flex;align-items:center;gap:6px}
.fb .h svg{width:18px;height:18px}
.fb.ok .h{color:var(--ok)}.fb.near .h{color:var(--warn)}.fb.bad .h{color:var(--bad)}
.fb ul{margin:6px 0 0;padding-left:18px}
.fb li{margin:2px 0}
.fb .model{margin-top:6px;font-weight:600}
.fb .model .ph{color:var(--red);font-weight:600}
.clock{display:flex;gap:14px;align-items:center;margin-top:6px}
.clock svg{width:110px;height:110px;flex:none}
.clock .dig{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy)}
.bignum{font-size:54px;font-weight:800;color:var(--navy);line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
.street{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;font-weight:700;text-align:center}
.street .b{border:2px solid var(--line);border-radius:8px;padding:10px 4px;background:var(--card)}
.street .road{grid-column:1/-1;height:18px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--ink-3) 0 14px,transparent 14px 26px) center/100% 2px no-repeat,var(--card-2)}
.street .empty{border-style:dashed;color:var(--ink-3);font-weight:500}
.scene{margin-top:6px;border-radius:14px;padding:10px 12px;background:var(--card-2);border:1px solid var(--line)}
.scene b{display:block;font-size:15px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ---------- dock (micrófono) ---------- */
.dock{position:relative;z-index:2;border-top:1px solid var(--line);background:var(--card);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(21,33,63,.06)}

.mic{position:relative;width:78px;height:78px;border-radius:50%;border:0;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px rgba(32,62,140,.35);flex:none}

.opt{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card-2);font-weight:600;text-align:left;padding:8px 14px;cursor:pointer;font-size:15px}
.opt:hover{border-color:var(--navy)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.textrow{display:flex;gap:8px;width:100%}
.textrow input{flex:1;min-width:0;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card-2);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}

.sheet{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
@media (min-width:700px){.sheet{border-radius:22px}}
.sheet h2{font-size:20px;font-weight:800;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row label{font-weight:600}
.row small{display:block;font-weight:400;color:var(--ink-2);font-size:12.5px}
.row input[type=text],.row select{min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card-2);color:var(--ink);padding:0 10px;font:inherit;max-width:55%}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:3px solid var(--c-subj);outline-offset:2px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--navy);color:var(--on-navy)}
.onb{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
.onb .card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px;max-width:460px;width:100%;text-align:center}
.onb .card .ava-xl{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--navy)}
.onb h1{font-family:var(--f-hand);font-size:32px;color:var(--navy);margin-top:10px}
.onb p{color:var(--ink-2)}
.onb input{width:100%;box-sizing:border-box;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card-2);color:var(--ink);padding:0 14px;font:inherit;font-size:17px;text-align:center;margin:8px 0 14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%;box-shadow:var(--shadow)}

.gate-msg{color:var(--bad);font-weight:600;font-size:14px;min-height:20px;margin:-6px 0 12px}
.gate-note{font-size:12.5px;color:var(--ink-3);margin:12px 0 0}
#gate-code{text-transform:uppercase;letter-spacing:.08em;font-weight:700}

[hidden]{display:none!important}
#app.full{height:100%}
</style>

      if (i > 0 && j > 0 && T[i - 1] === H[j - 1] && D[i][j] === D[i - 1][j - 1]) { ops.push({ op: 'eq', a: T[i - 1], b: H[j - 1] }); i--; j--; }

  function containsSeq(H, P) {

      if (p.endsWith('$')) { end = true; p = p.slice(0, -1); }

  /* ---------- Pistas de gramática a partir de la alineación ---------- */
  const BE = ['am','is','are'], PAST_BE = ['was','were'];

      const o = ops[k];
      const prevT = (() => { let seen = 0; for (let q = k - 1; q >= 0 && seen < 4; q--) if (ops[q].a) { seen++; if (BASE_AFTER.includes(ops[q].a)) return ops[q].a; } for (let q = k - 1; q >= 0; q--) if (ops[q].a) return ops[q].a; return ''; })();

        const a = o.a, b = o.b;
        if (b === a + 's' || b === a + 'es' || (a === 'have' && b === 'has') || b === a.replace(/y$/, 'ies')) {
          if (BASE_AFTER.includes(prevT) || prevT === 'not') add('Después de ' + (prevT === 'two' ? 'to' : prevT === 'not' ? 'don\'t / doesn\'t / didn\'t' : prevT) + ' el verbo va en forma base, sin s: «' + a + '».');
          else add('Aquí va «' + a + '», sin s.');
        } else if (a === b + 's' || a === b + 'es' || (a === 'has' && b === 'have') || a === b.replace(/y$/, 'ies')) {
          add('Con he, she o it el verbo lleva s: «' + a + '».');
        } else if (BE.includes(a) && BE.includes(b)) add('Revisa el verbo to be: aquí va «' + a + '» (I → am; he/she/it → is; you/we/they → are).');
        else if (PAST_BE.includes(a) && PAST_BE.includes(b)) add('Revisa was/were: was con I, he, she, it; were con you, we, they. Aquí va «' + a + '».');
        else if ((a === 'a' && b === 'an') || (a === 'an' && b === 'a')) add('a o an depende del sonido: an antes de sonido de vocal. Aquí va «' + a + '».');
        else if (SUBJ.includes(a) && SUBJ.includes(b)) add('Revisa el pronombre: aquí va «' + a + '».');
        else if (OBJ.includes(a) && (SUBJ.includes(b) || OBJ.includes(b) || POSS.includes(b))) add('Después del verbo o de una preposición va el pronombre de objeto: «' + a + '».');
        else if (POSS.includes(a) && (POSS.includes(b) || SUBJ.includes(b))) add('Revisa el posesivo: aquí va «' + (a === 'there' ? 'their' : a) + '». Manda el dueño, no la cosa.');
        else if ((a === 'do' && b === 'does') || (a === 'does' && b === 'do')) add('Con he, she, it va does; con I, you, we, they va do. Aquí: «' + a + '».');
        else if (DEMO.includes(a) && DEMO.includes(b)) add('this/that = uno; these/those = varios. this/these = cerca; that/those = lejos. Aquí: «' + a + '».');
        else if ((a === 'much' && b === 'many') || (a === 'many' && b === 'much')) add('many con lo que se cuenta; much con lo que no se cuenta. Aquí: «' + a + '».');
        else if (PREP.includes(a) && PREP.includes(b)) add('Revisa la preposición: aquí va «' + a + '».');

        if (o.a === 'two') add('Te faltó «to».');
        else if (o.a === 'a' || o.a === 'an') add('Te faltó el artículo «' + o.a + '».');

        else if (o.a === 'not') add('Te faltó «not» (la negación).');

      (r.tips || []).forEach(t => lines.push('«' + t.w + '»: ' + t.text + (t.heardAs ? ' (Te entendí «' + t.heardAs + '».)' : '')));
      if (r.tip && !lines.includes(r.tip)) lines.push(r.tip);
      if (!lines.length && cfg.item.mode !== 'check' && r.missing && r.missing.length && r.missing.length <= 3) lines.push('Te faltó: ' + r.missing.join(', ') + '.');
      if (!lines.length && cfg.tip) lines.push(cfg.tip);
      if (!lines.length && cfg.item.mode === 'es') lines.push('Toca «Lento» para escucharla despacio. Si no la reconoces, toca «Ver opciones».');
      const last = tries === maxTries;
      const title = r.trap ? '¡Mucho cuidado!' : r.near ? '¡Casi! Vamos otra vez.' : last ? 'No pasa nada, así se aprende.' : 'Escucha y vuelve a intentarlo.';
      fbCard(r.near ? 'near' : 'bad', title, lines.slice(0, 3), cfg.model);
      if (cfg.model) {
        const heardShort = r.heard && r.heard.trim().split(/\s+/).length <= 8 ? r.heard.trim() : '';
        if (r.near && heardShort && (cfg.item.mode === 'pron' || cfg.item.mode === 'exact') && S.settings.readEs && E.Voice.es) {
          await T(sayMix([{ t: 'Dijiste:', lang: 'es' }, { t: heardShort, lang: 'en' }, { t: 'Y se dice:', lang: 'es' }]));
        } else {
          await T(sayMix([{ t: r.near ? '¡Casi! Escucha:' : 'Escucha cómo se dice:', lang: 'es' }]));
        }
        await T(sayEn(cfg.model.say || cfg.model.text, { slow: tries >= 2 }));
      }
      if (last) {
        if (cfg.reviewEntry) addReview(...cfg.reviewEntry);
        tutor(h('div', { text: 'Lo guardé en tu repaso para practicarlo después. ¡Sigamos!' }));
        await T(sleep(700));
        return { score: r.near ? 0.25 : 0, ok: false };
      }
    }
    return { score: 0, ok: false };
  }
  const opt = (label, correct) => ({ label, correct: !!correct });
  function optsFrom(correct, wrongs) { return shuffle([opt(correct, true)].concat((wrongs || []).slice(0, 3).map(w => opt(w, false)))); }

  /* ----- ejecutar la misión ----- */
  async function runLesson(lesson) {
    const spec = lesson.spec;
    const intro = spec.key ? 'Misión: ' + spec.title + '.' : spec.title + '.';
    const how = micUsable() ? 'Cuando veas el micrófono, tócalo y habla. Si no te sale, lo intentamos otra vez: equivocarse es parte de aprender.' : 'Hoy contestas tocando o escribiendo. Repite cada frase en voz alta: tu oído y tu boca también aprenden.';
    tutor(h('div', {}, h('b', { text: (plainName() ? '¡Vamos, ' + plainName() + '! ' : '¡Vamos! ') + intro }), h('div', { text: how })));
    await T(sayEs((plainName() ? '¡Vamos, ' + plainName() + '! ' : '¡Vamos! ') + intro));
    for (lesson.i = 0; lesson.i < spec.steps.length; lesson.i++) {
      if (lesson.aborted || L !== lesson) throw ABORT;
      progress();
      await runStep(spec.steps[lesson.i]);
      await T(sleep(250));
    }
    lesson.i = spec.steps.length; progress();
    finishLesson(lesson);
  }
  function addScore(s, n) { if (!L) throw ABORT; L.score += s; L.max += (n || 1); }

  async function runStep(st) {
    switch (st.t) {
      case 'note': return stepNote(st);
      case 'rep': return stepRep(st);
      case 'mean': return stepMean(st);
      case 'say': return stepSay(st);
      case 'ask': return stepAsk(st);
      case 'pick': return stepPick(st);
      case 'story': return stepStory(st);
      case 'clock': return stepClock(st);
      case 'num': return stepNum(st);
      case 'phone': return stepPhone(st);
      case 'spell': return stepSpell(st);
      case 'conv': return stepConv(st);
    }
  }

  async function stepNote(st) {
    if (st.kind === 'q') {
      const tp = st.topic;
      tutor(h('div', {}, h('span', { class: 'tag', text: tp.id === 'F' ? 'Repaso' : tp.id }), ' ', h('b', { text: tp.name })),
        h('div', { class: 'quote', html: '<b>Shakespeare dice:</b> “' + esc(tp.quote) + '”' }),
        C.VIDEOS[tp.id] ? h('div', { class: 'arow' }, h('a', { class: 'abtn', href: C.VIDEOS[tp.id], target: '_blank', rel: 'noopener' }, ic('video'), 'Ver la clase')) : null);
      sayEs(tp.id === 'F' ? 'Repaso final.' : 'Tema ' + tp.id + ': ' + tp.name + '.');
    } else {
      tutor(h('div', { class: st.kind === 'cuidado' ? 'care' : 'truco', text: st.text }));
    }
    await waitContinue('Continuar');
  }

  async function stepRep(st, opt2) {
    opt2 = opt2 || {};
    if (!opt2.silentIntro) tutor(h('div', { text: st.review ? 'Repasemos esta frase:' : 'Escucha y repite:' }), phraseCard(st.en, { ph: st.ph, es: st.es, tip: st.tip }));

  async function stepMean(st) {
    const card = phraseCard(st.en, { ph: st.ph, hidden: true });
    tutor(h('div', {}, h('b', { text: 'Escucha bien. ¿Qué significa?' }), ' Dímelo en español.'), card);
    await T(sayMix([{ t: '¿Qué significa?', lang: 'es' }, { t: st.en, lang: 'en' }]));
    const res = await attempt({
      item: { mode: 'es', es: st.es }, lang: 'es-MX', model: null, expect: st.es[0],
      options: optsFrom(st.opts[0], st.opts.slice(1)), replay: () => sayEn(st.en), maxTries: 2, allowType: true
    });
    card.reveal();
    if (!res.ok) fbCard('bad', '«' + st.en.replace(/[.!?]$/, '') + '» significa «' + st.opts[0].replace(/[.!?]$/, '') + '».', []);
    addScore(res.score);
    await T(sleep(300));
    tutor(h('div', { text: 'Ahora dilo tú en inglés:' }), phraseCard(st.en, { ph: st.ph, es: st.opts[0] }));
    await stepRep(st, { silentIntro: true });
  }

  function sayItem(st) { return { mode: 'exact', ans: st.ans, kw: st.kw, traps: st.traps }; }
  async function stepSay(st) {
    const model = { text: st.model || st.ans[0], ph: st.ph };
    if (st.ctx) {
      tutor(h('div', { class: 'sitcard' }, ic('pin'), h('div', { text: st.ctx })), h('div', { style: 'margin-top:6px', text: '¿Qué dices en inglés?' }));
      await T(sayEs(st.ctx));
    } else if (st.src) {
      tutor(h('div', { html: '<b>' + esc(st.ins) + '</b>' }), phraseCard(st.src, { say: st.src.replace(/_+/g, ' blank ') }));
      await T(sayEs(st.ins));
    } else {
      tutor(h('div', { html: '<b>' + esc(st.cue) + '</b>' }));
      await T(sayEs(st.cue));
    }
    const res = await attempt({
      item: sayItem(st), lang: 'en-US', model, tip: st.tip,
      options: st.wrong ? optsFrom(model.text, st.wrong) : null, repeatAfter: true,
      reviewEntry: [model.text, st.ph, st.cue || st.ctx || st.ins]
    });
    addScore(res.score);
  }

  function askItem(chk, ctx) {
    if (chk && typeof chk === 'object' && !Array.isArray(chk)) return { mode: 'exact', ans: chk.ans || [], kw: chk.kw, traps: chk.traps };
    if (Array.isArray(chk)) return { mode: 'exact', ans: chk };
    return { mode: 'check', chk };
  }
  async function stepAsk(st, who) {
    const line = fill(st.line);
    if (st.who === 'luti' || !who) {
      tutor(phraseCard(line, { es: st.es, esHidden: true }));
    } else {
      charMsg(who, phraseCard(line, { es: st.es, esHidden: true, voice: who.g === 'm' ? 2 : 1 }));
    }
    await T(sayEn(line, { voice: who && who.g === 'm' ? 2 : 1 }));
    const model = st.model ? { text: fill(String(st.model).split(' / ')[0]), ph: st.ph } : null;
    const res = await attempt({
      item: askItem(st.chk), lang: 'en-US', ctx: { name: plainName() }, model,
      options: st.opts ? optsFrom(st.opts[0], st.opts.slice(1)) : null, repeatAfter: !!st.opts,
      replay: () => sayEn(line, { voice: who && who.g === 'm' ? 2 : 1 }), maxTries: st.opts ? 3 : 2,
      reviewEntry: model && st.opts ? [model.text, st.ph, st.es] : null
    });
    if (!res.ok && model && !st.opts) tutor(h('div', {}, 'Un ejemplo de respuesta: ', h('b', { html: colorize(model.text) })));
    addScore(res.score);
  }

  async function stepPick(st) {
    tutor(h('div', {}, h('b', { text: st.q })), h('div', { class: 'arow' }, h('button', { class: 'abtn', onclick: () => sayEn(st.audio) }, ic('speaker'), 'Escuchar'), h('button', { class: 'abtn', onclick: () => sayEn(st.audio, { slow: true }) }, ic('slow'), 'Lento')));
    await T(sayEn(st.audio));
    const ans = await waitAnswer({ startMode: 'options', options: optsFrom(st.opts[0], st.opts.slice(1)), replay: () => sayEn(st.audio), allowType: false });
    if (ans.kind === 'abort') throw ABORT;
    clearDock();
    if (ans.kind === 'skip') { fbCard('bad', 'Era: ' + st.opts[0], [st.tip].filter(Boolean)); addScore(0); return; }
    meMsg('option', ans.label);
    if (ans.correct) { fbCard('ok', '¡Buen oído!', [st.tip].filter(Boolean)); sayEn(pickOne(PRAISE)); addScore(1); }
    else { fbCard('bad', 'Era: ' + st.opts[0], [st.tip].filter(Boolean)); await T(sayEn(st.audio, { slow: true })); addScore(0); }
    await T(sleep(400));
  }

  async function stepStory(st) {
    const scene = st.scene === 'street' ? h('div', { class: 'street', 'aria-label': 'Mapa de la calle' },
      h('div', { class: 'b', text: 'bank' }), h('div', { class: 'b', text: 'pharmacy' }), h('div', { class: 'b', text: 'café' }),
      h('div', { class: 'road' }),
      h('div', { class: 'b empty', text: '' }), h('div', { class: 'b', text: 'house' }), h('div', { class: 'b', text: 'park' })) : null;
    tutor(h('div', {}, h('b', { text: 'Escucha con atención: ' }), st.title), phraseCard(st.text, { hidden: true, es: st.es, esHidden: true, say: st.say || st.text }), scene);
    await T(sayEn(st.say || st.text));
    for (let qi = 0; qi < st.qs.length; qi++) {
      const q = st.qs[qi];
      tutor(h('div', { text: 'Pregunta ' + (qi + 1) + ' de ' + st.qs.length + ':' }), phraseCard(q.q, { es: q.qEs, esHidden: true }));
      await T(sayEn(q.q));
      let item;
      if (q.chk && String(q.chk).startsWith('yn:')) {
        const base = E.ynCheck(q.chk.slice(3)), expectNo = /^no\b/i.test(q.opts[0]);
        item = { mode: 'check', chk: (H, ctx) => { const r = base(H, ctx); if (!r.ok) return r; const neg = H.includes('know') || H.includes('not'); if (neg !== expectNo) return { ok: false, near: false, tip: 'Revisa la historia: la respuesta es «' + q.opts[0] + '».' }; return r; } };
      } else item = { mode: 'exact', ans: q.ans, kw: q.kw, traps: q.traps };
      const res = await attempt({
        item, lang: 'en-US', model: { text: q.opts[0] }, tip: q.tip,
        options: optsFrom(q.opts[0], q.opts.slice(1)), replay: () => sayEn(st.say || st.text), maxTries: 2, repeatAfter: true
      });
      if (res.ok && q.tip) tutor(h('div', { class: 'truco', text: q.tip }));
      addScore(res.score);
    }
  }

  function clockSvg(hh, mm) {
    const ang = (v, max) => (v / max) * 2 * Math.PI - Math.PI / 2;
    const ha = ang((hh % 12) + mm / 60, 12), ma = ang(mm, 60);
    const ticks = Array.from({ length: 12 }, (_, i) => { const a = ang(i, 12); return `<line x1="${50 + 38 * Math.cos(a)}" y1="${50 + 38 * Math.sin(a)}" x2="${50 + 43 * Math.cos(a)}" y2="${50 + 43 * Math.sin(a)}" stroke="currentColor" stroke-width="${i % 3 === 0 ? 3 : 1.5}" stroke-linecap="round"/>`; }).join('');
    return `<svg viewBox="0 0 100 100" role="img" aria-label="Reloj que marca ${hh}:${String(mm).padStart(2, '0')}" style="color:var(--ink)"><circle cx="50" cy="50" r="47" fill="var(--card)" stroke="var(--navy)" stroke-width="4"/>${ticks}<line x1="50" y1="50" x2="${50 + 24 * Math.cos(ha)}" y2="${50 + 24 * Math.sin(ha)}" stroke="var(--navy)" stroke-width="5" stroke-linecap="round"/><line x1="50" y1="50" x2="${50 + 36 * Math.cos(ma)}" y2="${50 + 36 * Math.sin(ma)}" stroke="var(--red)" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="var(--ink)"/></svg>`;
  }
  async function stepClock(st) {
    const hh = st.h, mm = st.m, nw = E.numWords;
    const H = nw(hh), next = nw(hh % 12 + 1);
    const ans = E.timeAnswers(hh, mm);
    const traps = [];
    if (mm !== 0) traps.push(['oclock', 'O\'clock solo va con horas exactas.']);
    if (mm === 45) traps.push(['quarter to ' + H, 'Con to piensas en la hora que sigue: a quarter to ' + next + '.']);
    if (mm === 15) traps.push(['quarter to ' + H + '|quarter to ' + next, '15 minutos DESPUÉS de la hora es past: a quarter past ' + H + '.']);
    if (mm === 30) traps.push(['half to', 'Media hora es half past: half past ' + H + '.']);
    if (mm > 30 && mm !== 45) traps.push([nw(60 - mm) + ' to ' + H, 'Con to piensas en la hora que sigue: ' + nw(60 - mm) + ' to ' + next + '.']);
    const wrong = mm === 45 ? ["It's a quarter to " + H + '.', "It's a quarter past " + H + '.'] : mm === 15 ? ["It's a quarter to " + H + '.', "It's " + H + ' fifty.'] : mm === 30 ? ["It's half past " + next + '.', "It's half to " + H + '.'] : mm === 0 ? ["It's " + next + " o'clock.", "It's " + H + ' thirty.'] : mm < 30 ? ["It's " + nw(mm) + ' to ' + H + '.', "It's " + nw(mm) + ' past ' + next + '.'] : ["It's " + nw(60 - mm) + ' past ' + H + '.', "It's " + nw(60 - mm) + ' to ' + H + '.'];
    const display = hh + ':' + String(mm).padStart(2, '0');
    tutor(h('div', {}, h('b', { text: 'What time is it?' }), ' Dime la hora en inglés.'), h('div', { class: 'clock' }, h('span', { html: clockSvg(hh, mm) }), h('div', { class: 'dig', text: display })));
    await T(sayEn('What time is it?'));
    const model = { text: "It's " + (mm === 0 ? ans[0] : ans[1]) + '.', say: "It's " + (mm === 0 ? ans[0] : ans[1]) };
    const res = await attempt({
      item: { mode: 'exact', ans, traps }, lang: 'en-US', model,
      tip: 'Puedes decirla digital (It\'s ' + ans[0] + ') o tradicional (It\'s ' + (ans[1] || ans[0]) + ').',
      options: optsFrom(model.text, wrong), repeatAfter: true, afterOption: 'También se dice digital: It\'s ' + ans[0] + '.', reviewEntry: [model.text, '', display]
    });
    if (res.ok && mm !== 0) tutor(h('div', {}, 'También se dice: ', h('b', { text: "It's " + ans[0] + '.' })));
    addScore(res.score);
  }

  async function stepNum(st) {
    const n = st.n, w = E.numWords(n), disp = w.replace(/(ty) (one|two|three|four|five|six|seven|eight|nine)$/, '$1-$2');
    const traps = [];
    if (n >= 13 && n <= 19) { const conf = E.numWords((n - 10) * 10); traps.push([conf, 'Escuché ' + conf + ' (' + (n - 10) * 10 + '). ' + (E.PRON[w] ? 'Para ' + n + ' carga la voz al final: [' + E.PRON[w] + '].' : 'Para ' + n + ' carga la voz al final: -TEEN.')]); }
    if (n >= 30 && n <= 90 && n % 10 === 0) { const conf = E.numWords(n / 10 + 10); traps.push([conf, 'Escuché ' + conf + ' (' + (n / 10 + 10) + '). ' + (E.PRON[w] ? 'Para ' + n + ' carga la voz al principio: [' + E.PRON[w] + '].' : 'Para ' + n + ' carga la voz al principio.')]); }
    tutor(h('div', { text: 'Di este número en inglés:' }), h('div', { class: 'bignum', text: n.toLocaleString('en-US') }));
    const wrongs = [];
    if (n >= 13 && n <= 19) wrongs.push(E.numWords((n - 10) * 10)); else if (n >= 30 && n <= 90 && n % 10 === 0) wrongs.push(E.numWords(n / 10 + 10));
    wrongs.push(E.numWords(n < 100 ? (n % 10) * 10 + Math.floor(n / 10) || n + 1 : n + 10));
    const res = await attempt({ item: { mode: 'exact', ans: [w], traps }, lang: 'en-US', model: { text: disp, ph: E.PRON[w] || '' }, options: optsFrom(disp, wrongs.filter(x => x !== w).map(x => x.replace(/(ty) (one|two|three|four|five|six|seven|eight|nine)$/, '$1-$2'))), repeatAfter: true, reviewEntry: [disp, E.PRON[w] || '', String(n)] });
    addScore(res.score);
  }

  async function stepPhone(st) {
    const words = st.digits.split('').map(d => d === '0' ? 'oh' : E.numWords(+d)).join(' ');
    if (micUsable()) {
      tutor(h('div', { text: 'Dicta este número de teléfono, dígito por dígito (el cero se puede decir «oh»):' }), h('div', { class: 'bignum', style: 'font-size:38px', text: st.display }));
      const res = await attempt({ item: { mode: 'digits', digits: st.digits }, lang: 'en-US', model: { text: words, say: st.digits.split('').map(d => d === '0' ? 'oh' : d).join(', ') }, allowType: false, maxTries: 2 });
      addScore(res.score);
    } else {
      const alt1 = st.digits.slice(0, -2) + st.digits.slice(-1) + st.digits.slice(-2, -1), alt2 = st.digits.replace(/0/, '6');
      const fmt = d => d.slice(0, 2) + ' ' + d.slice(2, 6) + (d.length > 6 ? ' ' + d.slice(6) : '');
      tutor(h('div', { text: 'Escucha el número de teléfono. ¿Cuál es?' }));
      const sayIt = () => sayEn(st.digits.split('').map(d => d === '0' ? 'oh' : d).join(', '));
      await sayIt();
      const ans = await waitAnswer({ startMode: 'options', options: optsFrom(fmt(st.digits), [fmt(alt1), fmt(alt2)].filter(x => x !== fmt(st.digits))), replay: sayIt });
      if (ans.kind === 'abort') throw ABORT;
      clearDock();
      if (ans.kind === 'option') meMsg('option', ans.label);
      if (ans.correct) { fbCard('ok', '¡Buen oído!', []); addScore(1); } else { fbCard('bad', 'Era: ' + fmt(st.digits), ['Los teléfonos se dicen dígito por dígito: ' + words + '.']); addScore(0); }
    }
  }

  const LETTER_PH = { A: 'ei', B: 'bi', C: 'si', D: 'di', E: 'i', F: 'ef', G: 'yi', H: 'eich', I: 'ai', J: 'yei', K: 'kei', L: 'el', M: 'em', N: 'en', O: 'ou', P: 'pi', Q: 'kiu', R: 'ar', S: 'es', T: 'ti', U: 'iu', V: 'vi', W: 'dábel iu', X: 'eks', Y: 'uai', Z: 'zi' };
  async function stepSpell(st) {
    if (st.mode === 'listen') {
      const audio = st.audio || st.word.split('').join('. ') + '.';
      tutor(h('div', {}, h('b', { text: 'Escucha cómo deletreo un nombre. ¿Cuál es?' })), h('div', { class: 'arow' }, h('button', { class: 'abtn', onclick: () => sayEn(audio, { slow: true }) }, ic('speaker'), 'Escuchar otra vez')));
      await T(sayEn(audio, { slow: true }));
      const ans = await waitAnswer({ startMode: 'options', options: optsFrom(st.opts[0], st.opts.slice(1)), replay: () => sayEn(audio, { slow: true }) });
      if (ans.kind === 'abort') throw ABORT;
      clearDock();
      if (ans.kind === 'option') meMsg('option', ans.label);
      const spelled = st.word.split('').join('-');
      if (ans.correct) { fbCard('ok', '¡Buen oído! ' + spelled, []); addScore(1); } else { fbCard('bad', 'Era ' + st.opts[0] + ': ' + spelled, ['Fíjate: E se dice «i», I se dice «ai», G «yi» y J «yei».']); addScore(0); }
      return;
    }
    const word = st.word === '{name}' ? plainName().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z]/g, '').toUpperCase() : st.word;
    if (!word) return;
    const letters = word.split('');
    tutor(h('div', {}, h('b', { text: st.word === '{name}' ? 'Deletrea tu nombre en inglés, letra por letra:' : 'Deletrea en inglés, letra por letra:' })),
      h('div', { class: 'phrase' }, h('div', { class: 'en', text: letters.join('-') }), h('div', { class: 'ph', text: '[' + letters.map(l => LETTER_PH[l] || l).join(' · ') + ']' }),
        h('div', { class: 'arow' }, h('button', { class: 'abtn', onclick: () => sayEn(letters.join('. ') + '.', { slow: true }) }, ic('speaker'), 'Escuchar'))));
    const res = await attempt({ item: { mode: 'spell', word }, lang: 'en-US', model: { text: letters.join('-'), say: letters.join('. ') + '.' }, selfcheck: true, replay: () => sayEn(letters.join('. ') + '.', { slow: true }), maxTries: 2, allowType: false });
    addScore(res.score);
  }

  async function stepConv(st) {
    const c = C.CONVS[st.id];
    tutor(h('div', {}, h('b', { text: 'Situación: ' + c.title })), h('div', { class: 'scene', text: c.scene }), h('div', { style: 'margin-top:6px', text: 'Contesta con oraciones completas. ¡Tú puedes!' }));
    await T(sayEs('Situación: ' + c.title + '. ' + c.scene));
    await waitContinue('¡Empezar!');
    for (const turn of c.turns) {
      if (turn.cue) {
        tutor(h('div', { class: 'truco' }, h('b', { text: 'Tu turno: ' }), turn.cue));
        await T(sayEs('Tu turno: ' + turn.cue));
        const model = { text: fill(turn.model) };
        const res = await attempt({ item: askItem(turn.chk), lang: 'en-US', model, ctx: { name: plainName() }, maxTries: 2, reviewEntry: [model.text, '', turn.cue] });
        addScore(res.score);
      } else {
        await stepAsk({ line: turn.line, es: turn.es, chk: turn.chk, model: turn.model }, c.who);
      }
    }
  }

  function finishLesson(lesson) {
    const spec = lesson.spec;
    const pct = Math.round(100 * lesson.score / Math.max(1, lesson.max));
    const st = pct >= 90 ? 3 : pct >= 75 ? 2 : pct >= 50 ? 1 : 0;

  function renderAI(n) {

    const chat = h('div', { class: 'chat', 'aria-live': 'polite' });

      h('div', { class: 'lbar' }, h('button', { class: 'iconbtn', 'aria-label': 'Salir', onclick: () => { E.Voice.cancel(); E.Mic.abort(); ctl && ctl.abort(); nav('#u' + n); } }, ic('x')), h('span', { class: 'lt', style: 'flex:1', text: 'Conversación libre con IA · ' + (u.final ? 'Repaso final' : 'Unidad ' + n) })),

    const add = node => { chat.appendChild(node); requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; }); return node; };
    const tut = (...k) => add(h('div', { class: 'msg tutor' }, h('img', { class: 'ava', src: A.avatar, alt: TUTOR }), h('div', { class: 'bubble' }, k)));
    tut(h('b', { text: scene.title }), h('div', { text: 'Voy a platicar contigo en inglés con lo que ya aprendiste. Contesta con oraciones completas y te corrijo con calma.' }));
    const name = plainName() || 'the student';
    const RULES = `You are "Luti", a friendly green wolf who coaches Mexican students in A1 English, using the LUTIMOCA "Inglés A1" manual.
Role-play: you are ${scene.role}. The student's name is ${name}.
Level: A1 beginner. Use ONLY simple words and grammar from: ${scene.focus} (and easier topics like greetings, to be, numbers).
Every reply: react briefly to what the student said, then ask ONE simple question that needs a full-sentence answer. Max 2 short sentences, max 14 words each. No idioms, no advanced tenses.
The student's text comes from speech recognition or typing: ignore capitalization and punctuation. If a word looks misheard, it may be a pronunciation problem: mention that word kindly.
Check the student's LAST message. If it has a grammar or vocabulary error, write a short, kind explanation in Mexican Spanish (max 25 words) and the corrected English sentence. If it is correct, write a short praise in Spanish (max 6 words) and leave "corrected" empty.
After about 8 student answers, say goodbye warmly and set "end" to true.
Reply ONLY with JSON: {"feedback_es": string, "corrected": string, "ok": boolean, "reply": string, "reply_es": string, "end": boolean}
When the student's message is START, greet the student and ask the first question; then "feedback_es" and "corrected" are empty and "ok" is true.`;
    const turns = [{ role: 'user', content: RULES + '\n\nStudent: START' }];
    let ctl = null, busy = false, ended = false, count = 0, okCount = 0;
    const thinking = () => add(h('div', { class: 'msg tutor' }, h('img', { class: 'ava', src: A.avatar, alt: '' }), h('div', { class: 'bubble' }, h('span', { class: 'typing', 'aria-label': 'Luti está pensando' }, h('i'), h('i'), h('i')))));
    async function ask() {
      busy = true; drawInput();
      const t = thinking();
      ctl = new AbortController();
      try {
        const data = await SAMPLE.json(turns, { modelTier: 'quick', cache: false, signal: ctl.signal });
        t.remove();
        turns.push({ role: 'assistant', content: JSON.stringify(data) });
        if (count > 0) {

          else { okCount++; if (data.feedback_es) add(h('div', { class: 'fb ok', role: 'status' }, h('div', { class: 'h' }, ic('check'), data.feedback_es))); }
        }
        const reply = String(data.reply || '').trim();

        if (turns[turns.length - 1].role === 'user' && turns.length > 1 && code !== 'cancelled') { /* se deja para reintentar */ }

    function sendText(text) {

      if (!text || busy || ended) return;
      add(h('div', { class: 'msg me' }, h('div', { class: 'bubble' }, h('small', { text: 'Tú' }), h('span', { text: text }))));
      count++; S.stats.phrases++; save();
      turns.push({ role: 'user', content: 'Student: ' + text });
      while (JSON.stringify(turns).length > 60000 && turns.length > 4) turns.splice(1, 2);

    function drawInput() {

      if (ended) { dock.appendChild(h('div', { class: 'main' }, h('button', { class: 'btn primary', onclick: () => renderAI(n) }, ic('refresh'), 'Otra conversación'), h('button', { class: 'btn ghost', onclick: () => nav('#u' + n) }, 'Volver'))); return; }

      const row = h('div', { class: 'textrow' }, inp, h('button', { class: 'btn navy', 'aria-label': 'Enviar', disabled: busy, onclick: () => sendText(inp.value) }, ic('send')));
